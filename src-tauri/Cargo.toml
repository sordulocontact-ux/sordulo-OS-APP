[package]
name = "sordulo-os"
version = "0.2.2"
description = "Sordulo OS — app de bureau (Tauri 2) autour du front React/Vite"
authors = ["Sordulo"]
edition = "2021"
rust-version = "1.80"
# `tauri dev` lance `cargo run` : avec deux binaires, celui-ci est l'app (voir `src/claude/mod.rs`).
default-run = "sordulo-os"

[lib]
name = "sordulo_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# L'app elle-même (src/main.rs).
[[bin]]
name = "sordulo-os"
path = "src/main.rs"

# Relais appelé par les hooks de Claude Code (std + serde_json seulement). Voir `src/claude/mod.rs`.
[[bin]]
name = "sordulo-hook"
path = "src/bin/sordulo-hook.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
# Lancement à l'ouverture de session (clé Run sous Windows, LaunchAgent sous macOS). Voir src/autostart.rs.
tauri-plugin-autostart = "2.5"
# Mises à jour automatiques (GitHub Releases, `latest.json` signé) et notification « à jour ». Voir
# src/updater.rs.
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order : la fusion de ~/.claude/settings.json garde l'ordre des clés de l'utilisateur.
serde_json = { version = "1", features = ["preserve_order"] }
# Jeton du relais Claude Code et identifiants de demandes (déjà dans l'arbre de dépendances).
getrandom = "0.3"
anyhow = "1"
thiserror = "2"
log = "0.4"
# Connecteur Spotify (src/spotify/) : API Web en HTTPS, client bloquant appelé depuis ses threads.
# TLS du système (SChannel sous Windows, Security.framework sur Mac), ni rustls ni ring.
# Même version que celle déjà tirée par Tauri.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
# PKCE (S256, base64url sans remplissage) : mêmes versions que celles déjà dans Cargo.lock.
sha2 = "0.11"
base64 = "0.23"

# Implémentation Windows (détection du micro + capture WASAPI + encodage MP3).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
wasapi = "0.27"
mp3lame-encoder = "0.3"
rubato = "5"
# UI Automation : titre de la page affichée par un navigateur (Arc). Même version que celle de wasapi.
# Foundation, Media_Control, Storage_Streams : musique en cours (contrôles multimédias du système, WinRT),
# voir src/platform/windows/media.rs. WinRT est initialisé par CoInitializeEx (Win32_System_Com).
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Foundation", "Media_Control", "Storage_Streams"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell"] }

# macOS : île (encoche, niveau de fenêtre), détection du micro (bundle des apps), enregistrement (tap
# Core Audio). objc2 : mêmes versions que celles déjà tirées par Tauri (tao, wry). Encodage MP3 et
# rééchantillonnage : mêmes crates que Windows (chaîne partagée, voir src/platform/macos/mod.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# Musique en cours de tous les lecteurs, navigateurs compris (src/platform/macos/media_remote.rs) : MediaRemote
# par l'adaptateur Perl embarqué (/usr/bin/perl a le droit MediaRemote depuis macOS 15.4). La fonction
# `artwork` (par défaut) donne la pochette ; `image` la réduit à 256 px (JPEG). Même version que Tauri.
media-remote = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
mp3lame-encoder = "0.3"
rubato = "5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSGeometry", "NSString", "NSUUID", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSScreen", "NSWindow", "NSGraphics"] }

# Compilation de dev plus rapide (Windows et macOS) : infos de débogage réduites aux numéros de ligne
# (les panics gardent fichier et ligne, mais un débogueur ne montre plus les variables), aucune pour les
# dépendances. C'est surtout l'écriture du .pdb (Windows) et l'édition des liens qui raccourcissent.
# Pour déboguer pas à pas : remettre `debug = true` le temps de la séance.
[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
