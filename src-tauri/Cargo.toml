[package]
name = "sordulo-os"
version = "0.1.0"
description = "Sordulo OS — app de bureau (Tauri 2) autour du front React/Vite"
authors = ["Sordulo"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "sordulo_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"

# Implémentation Windows (détection du micro + capture WASAPI + encodage MP3).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
wasapi = "0.27"
mp3lame-encoder = "0.3"
rubato = "5"

# macOS : lot à venir (voir TICKET.md, lot L13). Aucune dépendance ce soir.

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
