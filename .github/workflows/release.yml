# Release de l'app de bureau : compile Mac (universel, signé) et Windows (NSIS) en parallèle, et chacun
# publie dès qu'il est prêt dans UNE release GitHub du tag (desktop-platform.yml) : installeurs,
# latest.json (mises à jour automatiques) et copies aux noms stables pour la page de téléchargement :
#   https://github.com/sordulocontact-ux/sordulo-OS-APP/releases/latest/download/Sordulo-OS-macOS.dmg
#   https://github.com/sordulocontact-ux/sordulo-OS-APP/releases/latest/download/Sordulo-OS-Windows-setup.exe
#
# Déclenchement :
#   - push sur main : version suivante calculée toute seule (patch + 1 après la plus haute entre
#     package.json et les tags vX.Y.Z), tag créé par la release, rien n'est commité. Les apps installées
#     se mettent à jour seules. Un push plus récent annule la compilation en cours (il contient tout).
#     Pas de release si le push ne touche que la doc, les tickets, l'API ou la base (pas dans l'app).
#   - tag vX.Y.Z poussé (créé par `npm run release`, pour choisir la version, ex. minor).
#   - à la main sur une branche (workflow_dispatch) : compile seulement, installeurs dans les artefacts.
name: Release app de bureau

on:
  push:
    branches: [main]
    tags: ['v*']
    # Ignoré pour les tags (GitHub n'applique pas les filtres de chemins aux tags).
    paths-ignore:
      - '**.md'
      - '.tickets/**'
      - 'api/**'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  prepare:
    name: Version
    # Le commit de `npm run release` arrive avec son tag : c'est le run du tag qui publie.
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags compris

      - id: version
        shell: bash
        run: |
          current=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in
            refs/tags/v*)
              version="${GITHUB_REF_NAME#v}"
              if [ "$version" != "$current" ]; then
                echo "::error::Tag $GITHUB_REF_NAME mais package.json en $current : utiliser npm run release."
                exit 1
              fi
              publish=true ;;
            refs/heads/main)
              version=$(node scripts/release.mjs --next-auto)
              publish=true ;;
            *)
              version="$current"
              publish=false ;;
          esac
          echo "Version $version (publication : $publish)"
          { echo "version=$version"; echo "tag=v$version"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

  # Chaque système est publié dès qu'il est prêt (Windows en quelques minutes, Mac plus tard) et
  # un échec de l'un n'empêche pas la publication de l'autre : voir desktop-platform.yml.
  macos:
    name: macOS
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-platform.yml
    secrets: inherit
    with:
      name: macOS
      os: macos-latest
      target: universal-apple-darwin
      rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      publish: ${{ needs.prepare.outputs.publish }}

  windows:
    name: Windows
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-platform.yml
    secrets: inherit
    with:
      name: Windows
      os: windows-latest
      target: x86_64-pc-windows-msvc
      rust-targets: x86_64-pc-windows-msvc
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      publish: ${{ needs.prepare.outputs.publish }}
